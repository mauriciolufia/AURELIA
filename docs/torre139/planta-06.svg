rados: no conectan las salas ni permiten rodear el muro central.</text><text x="800" y="1510" text-anchor="middle" fill="#d9e8ef" font-family="sans-serif" font-size="23">Exterior: piedra medieval gris azulada · Interior: ladrillo medieval · Tejado de pico.</text><text x="800" y="1580" text-anchor="middle" fill="#efbbab" font-family="sans-serif" font-size="21">GUARDIÁN DE BASALTO · BESTIA DE BRASA · VIGÍA CARMESÍ · ORÁCULO DE CENIZA</text><text x="800" y="1625" text-anchor="middle" fill="#d9e8ef" font-family="sans-serif" font-size="24">Cuatro enemigos por planta; dos en cada sala oriental. Salas occidentales libres.</text><text x="800" y="1710" text-anchor="middle" fill="#8daaba" font-family="sans-serif" font-size="23">DISEÑO TÉCNICO PREVIO A LA CONSTRUCCIÓN · AURELIA</text></svg>